name: TW Official Field Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect nested TPEx institutional grouping schema
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/probe.md
          import json
          import urllib.parse
          import urllib.request

          base = "https://www.tpex.org.tw/web/stock/3insti/daily_trade/3itrade_hedge_result.php"
          url = base + "?" + urllib.parse.urlencode({
              "l": "zh-tw", "o": "json", "se": "EW", "t": "D",
              "d": "115/07/24", "s": "0,asc",
          })
          request = urllib.request.Request(url, headers={"User-Agent": "ABSORB-contract-probe/1.0"})
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read(15 * 1024 * 1024).decode("utf-8-sig"))
          tables = payload.get("tables") or []
          table = tables[0] if tables else {}
          print("## TPEx institutional grouping schema")
          print(f"- date: `{payload.get('date')}`")
          print(f"- title: `{table.get('title')}`")
          print(f"- columnNum: `{table.get('columnNum')}`")
          print("- summary type: `" + type(table.get('summary')).__name__ + "`")
          print("- summary: `" + json.dumps(table.get('summary'), ensure_ascii=True, separators=(',', ':')) + "`")
          print("- template type: `" + type(payload.get('template')).__name__ + "`")
          print("- template: `" + json.dumps(payload.get('template'), ensure_ascii=True, separators=(',', ':'))[:12000] + "`")
          PY
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/probe.md

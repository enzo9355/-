name: TW Official Field Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect nested TPEx institutional field names
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/probe.md
          import json
          import urllib.parse
          import urllib.request

          base = "https://www.tpex.org.tw/web/stock/3insti/daily_trade/3itrade_hedge_result.php"
          url = base + "?" + urllib.parse.urlencode({
              "l": "zh-tw", "o": "json", "se": "EW", "t": "D",
              "d": "115/07/24", "s": "0,asc",
          })
          request = urllib.request.Request(url, headers={"User-Agent": "ABSORB-contract-probe/1.0"})
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read(15 * 1024 * 1024).decode("utf-8-sig"))
          tables = payload.get("tables") or []
          table = tables[0] if tables else {}
          fields = table.get("fields") or []
          print("## TPEx institutional field names")
          print(f"- date: `{payload.get('date')}`")
          print(f"- row count: `{len(table.get('data') or [])}`")
          print("- fields:")
          for index, field in enumerate(fields):
              print(f"  - {index}: `{field}`")
          PY
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/probe.md

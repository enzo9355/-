name: TW Official Field Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe TPEx institutional report JSON
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/probe.md
          import json
          import urllib.parse
          import urllib.request

          base = "https://www.tpex.org.tw/web/stock/3insti/daily_trade/3itrade_hedge_result.php"
          params = {
              "l": "zh-tw",
              "o": "json",
              "se": "EW",
              "t": "D",
              "d": "115/07/24",
              "s": "0,asc",
          }
          url = base + "?" + urllib.parse.urlencode(params)
          request = urllib.request.Request(url, headers={"User-Agent": "ABSORB-contract-probe/1.0"})
          print("## TPEx institutional report JSON contract")
          with urllib.request.urlopen(request, timeout=60) as response:
              body = response.read(15 * 1024 * 1024 + 1)
              if len(body) > 15 * 1024 * 1024:
                  raise RuntimeError("response too large")
              payload = json.loads(body.decode("utf-8-sig"))
              print(f"- status: `{response.status}`")
              print(f"- bytes: `{len(body)}`")
              print("- top keys: `" + "`, `".join(sorted(payload.keys())) + "`")
              for key in ("date", "reportDate", "report_date", "iTotalRecords", "iTotalDisplayRecords"):
                  if key in payload:
                      print(f"- {key}: `{payload[key]}`")
              rows = payload.get("aaData") or payload.get("data") or []
              print(f"- rows: `{len(rows)}`")
              first = next((row for row in rows if isinstance(row, list)), None)
              if first is not None:
                  print(f"- first row length: `{len(first)}`")
                  print("- first row cell types: `" + "`, `".join(type(item).__name__ for item in first) + "`")
              columns = payload.get("aoColumns") or payload.get("columns")
              if isinstance(columns, list):
                  names = []
                  for item in columns:
                      if isinstance(item, dict):
                          names.append(str(item.get("sTitle") or item.get("title") or item.get("data") or ""))
                      else:
                          names.append(str(item))
                  print("- columns: `" + "`, `".join(names) + "`")
          PY
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/probe.md

name: TW Official Field Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Probe and summarize six public official endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/probe.md
          import json
          import urllib.request

          sources = {
              "twse_price": "https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL",
              "twse_institutional": "https://www.twse.com.tw/rwd/zh/fund/T86?date=20260724&selectType=ALL&response=json",
              "twse_margin": "https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGN",
              "tpex_price": "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes",
              "tpex_institutional": "https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading",
              "tpex_margin": "https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance",
          }

          print("## Official source field probe")
          print()
          print("Only public schema names, row counts, response sizes, and date metadata are shown.")
          failures = []
          for name, url in sources.items():
              print()
              print(f"### `{name}`")
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "ABSORB-contract-probe/1.0"})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read(30 * 1024 * 1024 + 1)
                      if len(body) > 30 * 1024 * 1024:
                          raise RuntimeError("response too large")
                      payload = json.loads(body.decode("utf-8-sig"))
                      print(f"- status: `{response.status}`")
                      print(f"- bytes: `{len(body)}`")
                      if isinstance(payload, list):
                          sample = next((row for row in payload if isinstance(row, dict)), {})
                          date_fields = sorted(k for k in sample if "date" in k.lower() or "日期" in k)
                          print(f"- shape: `list`; rows: `{len(payload)}`")
                          print("- fields: `" + "`, `".join(sorted(sample.keys())) + "`")
                          print("- date fields: `" + "`, `".join(date_fields) + "`")
                          for key in date_fields:
                              values = [str(row[key]) for row in payload[:100] if isinstance(row, dict) and row.get(key) not in (None, "")]
                              print(f"- {key} values: `" + "`, `".join(sorted(set(values))[:5]) + "`")
                      elif isinstance(payload, dict):
                          fields = payload.get("fields")
                          data = payload.get("data")
                          print("- shape: `dict`")
                          print("- top keys: `" + "`, `".join(sorted(payload.keys())) + "`")
                          if isinstance(fields, list):
                              print("- fields: `" + "`, `".join(str(item) for item in fields) + "`")
                          if isinstance(data, list):
                              print(f"- rows: `{len(data)}`")
                          for key in sorted(payload):
                              if "date" in key.lower() or "日期" in key or key in {"stat", "title"}:
                                  value = payload.get(key)
                                  if isinstance(value, (str, int, float, bool)) or value is None:
                                      print(f"- {key}: `{value}`")
                      else:
                          print(f"- shape: `{type(payload).__name__}`")
              except Exception as exc:
                  failures.append(name)
                  print(f"- error type: `{type(exc).__name__}`")
                  print(f"- error: `{str(exc)[:200]}`")
          print()
          print(f"Failures: `{len(failures)}`")
          PY
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/probe.md

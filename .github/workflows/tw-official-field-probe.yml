name: TW Official Field Probe

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  probe-margin-fields:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe exact margin table field sequences
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/margin-fields.md
          import json
          import urllib.parse
          import urllib.request

          requests = {
              'twse_margin': (
                  'https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN',
                  {'date': '20260724', 'selectType': 'STOCK', 'response': 'json'},
              ),
              'tpex_margin': (
                  'https://www.tpex.org.tw/web/stock/margin_trading/margin_balance/margin_bal_result.php',
                  {'l': 'zh-tw', 'o': 'json', 'd': '115/07/24', 's': '0,asc'},
              ),
          }

          def fetch(base, params):
              url = base + '?' + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={'User-Agent': 'ABSORB-contract-probe/1.0'})
              with urllib.request.urlopen(req, timeout=60) as response:
                  body = response.read(20 * 1024 * 1024 + 1)
                  if len(body) > 20 * 1024 * 1024:
                      raise RuntimeError('response too large')
                  return response.status, json.loads(body.decode('utf-8-sig'))

          print('## Exact official margin field sequences')
          for source_id, (base, params) in requests.items():
              status, payload = fetch(base, params)
              tables = payload.get('tables') or []
              if source_id == 'twse_margin':
                  matches = [
                      table for table in tables
                      if isinstance(table, dict)
                      and len(table.get('fields') or []) == 16
                      and (table.get('fields') or [])[:2] == ['代號', '名稱']
                      and '股票' in str(table.get('title') or '')
                  ]
              else:
                  matches = [
                      table for table in tables
                      if isinstance(table, dict)
                      and len(table.get('fields') or []) == 20
                      and (table.get('fields') or [])[:2] == ['代號', '名稱']
                      and '融資融券餘額' in str(table.get('title') or '')
                  ]
              if len(matches) != 1:
                  raise RuntimeError(f'{source_id} target table count={len(matches)}')
              table = matches[0]
              print(f'\n### {source_id}')
              print(f'- HTTP: `{status}`')
              print(f'- response date: `{payload.get("date")}`')
              print(f'- table date: `{table.get("date")}`')
              print(f'- title: `{table.get("title")}`')
              print(f'- columnNum: `{table.get("columnNum")}`')
              print('- fields JSON: `' + json.dumps(table.get('fields'), ensure_ascii=True, separators=(',', ':')) + '`')
          PY
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/margin-fields.md

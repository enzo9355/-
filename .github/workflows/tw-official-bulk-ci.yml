name: TW Official Exact-Head Focused CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b22cf60e8cee4f416aef3ddfc701b59cbd09980e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Assert exact clean head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "b22cf60e8cee4f416aef3ddfc701b59cbd09980e"
          test -z "$(git status --porcelain)"
      - name: Run hardening and official-source focused tests
        shell: bash
        run: |
          python -m unittest \
            tests.test_tw_official_bulk \
            tests.test_tw_official_historical \
            tests.test_tw_official_hardening \
            tests.test_tw_incremental \
            tests.test_tw_official_post_close_cli \
            tests.test_pipeline_scheduler \
            -v
      - name: Check diff and governance
        shell: bash
        run: |
          git diff --check origin/main...HEAD
          python - <<'PY'
          from pathlib import Path
          from reporting.regression_input_builder import (
              PRODUCTION_REGRESSION_SOURCE_ADAPTER_READY,
              PRODUCTION_REGRESSION_INPUT_READY,
              PRODUCTION_REGRESSION_ARTIFACT_AVAILABLE,
              AGGREGATE_MANIFEST_INTERVAL_VALIDATION_READY,
          )
          assert not any((
              PRODUCTION_REGRESSION_SOURCE_ADAPTER_READY,
              PRODUCTION_REGRESSION_INPUT_READY,
              PRODUCTION_REGRESSION_ARTIFACT_AVAILABLE,
              AGGREGATE_MANIFEST_INTERVAL_VALIDATION_READY,
          ))
          assert not Path('backtests/v1/latest-TW.json').exists()
          PY

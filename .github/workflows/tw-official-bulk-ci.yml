name: TW Official Credential Marker Evidence

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b22cf60e8cee4f416aef3ddfc701b59cbd09980e
          fetch-depth: 0
      - name: Publish marker matches without values
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/markers.txt
          import pathlib
          import subprocess

          needles = {
              'private_key_marker': '-----BEGIN PRIVATE KEY-----',
              'supabase_secret_prefix': 'sb_secret_',
              'google_api_prefix': 'AIza',
              'bearer_example': 'Authorization: Bearer ',
          }
          files = subprocess.check_output(
              ['git','diff','--name-only','origin/main...HEAD'], text=True
          ).splitlines()
          found = []
          for name in files:
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              for line_no, line in enumerate(text.splitlines(), 1):
                  for category, needle in needles.items():
                      if needle in line:
                          found.append((name, line_no, category))
          if found:
              for name, line_no, category in found:
                  print(f'- `{name}:{line_no}:{category}`')
          else:
              print('- no marker matches')
          PY
          {
            echo '## Credential marker diagnostic'
            echo
            echo '- implementation head: `b22cf60e8cee4f416aef3ddfc701b59cbd09980e`'
            cat /tmp/markers.txt
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md

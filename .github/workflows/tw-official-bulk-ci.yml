name: TW Official Hardening RED

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hardening-red:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ad5e7283b16e312283583eaf9aa7b8a8d6b285e9
          fetch-depth: 0
      - name: Assert exact implementation head
        run: test "$(git rev-parse HEAD)" = "ad5e7283b16e312283583eaf9aa7b8a8d6b285e9"
      - name: Run hardening contract tests
        run: python -m unittest tests.test_tw_official_hardening -v

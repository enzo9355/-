name: TW Official Bulk Source CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  historical-contract-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe six date-addressable public official endpoints
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/probe.md
          import json
          import urllib.parse
          import urllib.request

          target = "20260724"
          roc = "115/07/24"
          sources = {
              "twse_price": (
                  "https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX",
                  {"date": target, "type": "ALLBUT0999", "response": "json"},
              ),
              "twse_institutional": (
                  "https://www.twse.com.tw/rwd/zh/fund/T86",
                  {"date": target, "selectType": "ALLBUT0999", "response": "json"},
              ),
              "twse_margin": (
                  "https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN",
                  {"date": target, "selectType": "STOCK", "response": "json"},
              ),
              "tpex_price": (
                  "https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php",
                  {"l": "zh-tw", "o": "json", "d": roc, "s": "0,asc,0"},
              ),
              "tpex_institutional": (
                  "https://www.tpex.org.tw/web/stock/3insti/daily_trade/3itrade_hedge_result.php",
                  {"l": "zh-tw", "o": "json", "se": "EW", "t": "D", "d": roc, "s": "0,asc"},
              ),
              "tpex_margin": (
                  "https://www.tpex.org.tw/web/stock/margin_trading/margin_balance/margin_bal_result.php",
                  {"l": "zh-tw", "o": "json", "d": roc, "s": "0,asc"},
              ),
          }

          def scalar_metadata(payload):
              result = {}
              if isinstance(payload, dict):
                  for key, value in payload.items():
                      if (
                          key.lower() in {"date", "stat", "title", "reportdate", "report_date"}
                          or "日期" in key
                      ) and isinstance(value, (str, int, float, bool)):
                          result[key] = value
              return result

          def describe_table(table):
              result = {"keys": sorted(table)}
              for key in ("date", "title", "subtitle", "columnNum", "totalCount"):
                  if key in table and isinstance(table[key], (str, int, float, bool)):
                      result[key] = table[key]
              fields = table.get("fields")
              if isinstance(fields, list):
                  result["fields"] = [str(item) for item in fields]
              for key in ("data", "aaData", "rows"):
                  rows = table.get(key)
                  if isinstance(rows, list):
                      result[f"{key}_count"] = len(rows)
                      first = next((item for item in rows if isinstance(item, (list, dict))), None)
                      if isinstance(first, list):
                          result[f"{key}_first_length"] = len(first)
                      elif isinstance(first, dict):
                          result[f"{key}_first_keys"] = sorted(first)
              return result

          print("## Date-addressable official source contract probe")
          failures = []
          for source_id, (base, params) in sources.items():
              print()
              print(f"### `{source_id}`")
              try:
                  url = base + "?" + urllib.parse.urlencode(params)
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "ABSORB-contract-probe/1.0"},
                  )
                  with urllib.request.urlopen(request, timeout=60) as response:
                      body = response.read(30 * 1024 * 1024 + 1)
                      if len(body) > 30 * 1024 * 1024:
                          raise RuntimeError("response too large")
                      payload = json.loads(body.decode("utf-8-sig"))
                  print(f"- status: `{response.status}`")
                  print(f"- bytes: `{len(body)}`")
                  print(f"- shape: `{type(payload).__name__}`")
                  print("- metadata: `" + json.dumps(scalar_metadata(payload), ensure_ascii=True, sort_keys=True) + "`")
                  if isinstance(payload, list):
                      print(f"- rows: `{len(payload)}`")
                      first = next((item for item in payload if isinstance(item, dict)), None)
                      if first:
                          print("- first row fields: `" + "`, `".join(sorted(first)) + "`")
                  elif isinstance(payload, dict):
                      print("- top keys: `" + "`, `".join(sorted(payload)) + "`")
                      fields = payload.get("fields")
                      data = payload.get("data")
                      if isinstance(fields, list):
                          print("- fields: `" + "`, `".join(str(item) for item in fields) + "`")
                      if isinstance(data, list):
                          print(f"- data rows: `{len(data)}`")
                          first = next((item for item in data if isinstance(item, (list, dict))), None)
                          if isinstance(first, list):
                              print(f"- first data row length: `{len(first)}`")
                          elif isinstance(first, dict):
                              print("- first data row fields: `" + "`, `".join(sorted(first)) + "`")
                      tables = payload.get("tables")
                      if isinstance(tables, list):
                          print(f"- tables: `{len(tables)}`")
                          for index, table in enumerate(tables[:4]):
                              if isinstance(table, dict):
                                  print(f"- table {index}: `" + json.dumps(describe_table(table), ensure_ascii=True, sort_keys=True) + "`")
              except Exception as exc:
                  failures.append(source_id)
                  print(f"- error type: `{type(exc).__name__}`")
                  print(f"- error: `{str(exc)[:240]}`")
          print()
          print(f"Failures: `{len(failures)}`")
          PY
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/probe.md

name: TW Official Bulk Source CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  focused-python310:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: 286f91b0676de11f0a68dc19a668f8848e2e9579
          fetch-depth: 0
      - name: Assert exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "286f91b0676de11f0a68dc19a668f8848e2e9579"
          test ! -e .github/workflows/tw-official-bulk-ci.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-report.txt
          python -m pip check
      - name: Focused tests with concise failure report
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          python -m unittest \
            tests.test_tw_official_bulk \
            tests.test_tw_official_historical \
            tests.test_tw_incremental \
            tests.test_tw_official_post_close_cli \
            tests.test_pipeline_scheduler \
            -v > /tmp/focused.txt 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            {
              echo '## Focused official catch-up diagnostic'
              echo
              echo '```text'
              grep -E '^(FAIL|ERROR):|^Ran [0-9]+ tests|^FAILED \(|^OK$' /tmp/focused.txt || true
              echo '--- final 160 lines ---'
              tail -n 160 /tmp/focused.txt
              echo '```'
            } > /tmp/comment.md
            gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
          else
            tail -n 12 /tmp/focused.txt
          fi
          exit "$code"

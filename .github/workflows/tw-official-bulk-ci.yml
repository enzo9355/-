name: TW Official Bulk Source Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  exact-head-marker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 1fdb3fa23f8eb63958cc8fdba43ce134dadc2c04
          fetch-depth: 0
      - name: Assert exact implementation head
        run: test "$(git rev-parse HEAD)" = "1fdb3fa23f8eb63958cc8fdba43ce134dadc2c04"
      - name: Confirm diagnostic is read-only
        run: |
          test -z "$(git status --porcelain)"
          echo "read-only diagnostic marker"

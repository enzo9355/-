name: TW Official Bulk Source CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  python310:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: b5f8e073baafa53876c9a1e275ab5db0a8def171
          fetch-depth: 0
      - name: Assert exact head
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "b5f8e073baafa53876c9a1e275ab5db0a8def171"
          test ! -e .github/workflows/tw-official-bulk-ci.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-report.txt
          python -m pip check
      - name: Focused official-source tests
        run: |
          python -m unittest \
            tests.test_tw_official_bulk \
            tests.test_tw_incremental \
            tests.test_tw_official_post_close_cli \
            tests.test_pipeline_scheduler \
            -v
      - name: Full suite with concise diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.txt 2>&1
          code=$?
          {
            echo '## Full-suite diagnostic'
            echo
            echo '```text'
            tail -n 250 /tmp/full-suite.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
          exit "$code"

name: TW Official Bulk Source CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  python310:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: b5f8e073baafa53876c9a1e275ab5db0a8def171
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-report.txt
      - name: Full suite concise diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > /tmp/full-suite.txt 2>&1
          code=$?
          {
            echo '## Concise full-suite diagnostic'
            echo
            echo '```text'
            grep -E '^(FAIL|ERROR):|^Ran [0-9]+ tests|^FAILED \(|^OK$' /tmp/full-suite.txt || true
            echo '--- final 35 lines ---'
            tail -n 35 /tmp/full-suite.txt
            echo '```'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
          exit "$code"

name: TW Official Windows Focused Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  combined-focused:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3948aa638a068f1494972244e7012a69380b5672
          fetch-depth: 0
      - name: Assert exact head
        shell: powershell
        run: |
          if ((git rev-parse HEAD).Trim() -ne '3948aa638a068f1494972244e7012a69380b5672') {
            throw 'Unexpected implementation head'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-report.txt
      - name: Install dependencies
        shell: powershell
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-report.txt
          python -m pip check
      - name: Run combined focused contracts
        shell: powershell
        run: |
          python -m unittest `
            tests.test_tw_official_bulk `
            tests.test_tw_official_historical `
            tests.test_tw_official_historical_guarded `
            tests.test_tw_incremental `
            tests.test_tw_official_post_close_cli `
            tests.test_pipeline_scheduler `
            -v

name: TW Official Guard Diagnostic

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  guard-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3948aa638a068f1494972244e7012a69380b5672
          fetch-depth: 0
      - name: Assert exact head
        run: test "$(git rev-parse HEAD)" = "3948aa638a068f1494972244e7012a69380b5672"
      - name: Run guard tests
        run: python -m unittest tests.test_tw_official_historical_guarded -v

name: TW Official Bulk Source CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  sync-design:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/tw-official-bulk-source
          fetch-depth: 0
      - name: Synchronize approved design with implemented contracts
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "6f05808900db69defbf1b795d3b7e256c4b789e7"
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/superpowers/specs/2026-07-25-tw-official-bulk-source-design.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'Proposed design for review. This document defines a code-only migration path; it does not authorize Production execution, GCS mutation, Scheduled Task changes, LINE delivery, historical backfill, model promotion, or changes to the four Production regression-readiness flags.':
              'Approved and implemented in Draft PR #15. Exact-head verification and Production rollout remain separate gates. This document does not authorize Production execution, GCS mutation, Scheduled Task changes, LINE delivery, historical publication backfill, model promotion, or changes to the four Production regression-readiness flags.',
              '- Price snapshot: `https://openapi.twse.com.tw/v1/exchangeReport/STOCK_DAY_ALL`\n- Margin snapshot: `https://openapi.twse.com.tw/v1/exchangeReport/MI_MARGN`\n- Institutional snapshot: `https://www.twse.com.tw/fund/T86?response=json&date={YYYYMMDD}&selectType=ALL`':
              '- Price report: `https://www.twse.com.tw/rwd/zh/afterTrading/MI_INDEX`\n- Margin report: `https://www.twse.com.tw/rwd/zh/marginTrading/MI_MARGN`\n- Institutional report: `https://www.twse.com.tw/rwd/zh/fund/T86`',
              '- Price snapshot: `https://www.tpex.org.tw/openapi/v1/tpex_mainboard_daily_close_quotes`\n- Margin snapshot: `https://www.tpex.org.tw/openapi/v1/tpex_mainboard_margin_balance`\n- Institutional snapshot: `https://www.tpex.org.tw/openapi/v1/tpex_3insti_daily_trading`':
              '- Price report: `https://www.tpex.org.tw/web/stock/aftertrading/daily_close_quotes/stk_quote_result.php`\n- Margin report: `https://www.tpex.org.tw/web/stock/margin_trading/margin_balance/margin_bal_result.php`\n- Institutional report: `https://www.tpex.org.tw/web/stock/3insti/daily_trade/3itrade_hedge_result.php`',
              'The TWSE and TPEx OpenAPI resources are latest-snapshot sources, not a historical backfill service. T86 is requested for the explicit target date. Every source still must prove the target trading date through its response contract; the runner may not assign the requested date to undated or stale rows.':
              'The implementation uses date-addressable official report endpoints for all six datasets. Every response and nested target table must prove the requested trading date. The runner may not assign the requested date to undated or stale rows. A run may enrich missing local history for at most ten trading sessions, but only the newest target date may become the latest publication; this is not historical publication backfill.',
              '- source mode: `tw_official_bulk_v1`':
              '- source mode: `tw_official_bulk_v2`',
              '- institutional or margin coverage is unexpectedly empty':
              '- institutional or margin coverage is below its source-specific absolute minimum: TWSE institutional 500, TWSE margin 400, TPEx institutional 300, or TPEx margin 300',
              'Antigravity must later perform a controlled local probe using no more than the six official source requests. The probe records only safe metadata:':
              'Antigravity must later perform a controlled single-date local probe using no more than six official source requests. A recovery that must enrich multiple missing trading sessions may use six cold requests per session, up to the hard limit of ten sessions; valid cache hits use zero requests. The probe records only safe metadata:',
              '4. Build one local target-date observation without publication.':
              '4. Build one local target-date observation without publication. The builder may enrich up to ten missing trading sessions in local per-symbol history, but it must not create historical report publications.',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'design replacement count is {count}: {old[:80]}')
              text = text.replace(old, new, 1)
          anchor = '## Testing strategy\n'
          notes = '''## Implemented contract notes

- Source mode is `tw_official_bulk_v2`; checkpoints from FinMind-per-symbol mode or earlier official modes are incompatible.
- The cold request budget is six attempts per required trading session, with a bounded worst case of twelve attempts per session under the two-attempt retry contract.
- Catch-up is bounded to ten missing trading sessions and only enriches local per-symbol history. It does not publish one report per historical date.
- The 2026-07-24 read-only contract probe observed 1,231 TWSE institutional symbols, 1,059 TWSE margin symbols, 794 TPEx institutional symbols, and 812 TPEx margin symbols. Production minimums are deliberately lower but non-trivial: 500, 400, 300, and 300 respectively.
- The TPEx institutional parser fingerprints the unique `三大法人買賣明細資訊` table, requires `columnNum=25`, its exact 24-field sequence, an exact table date, and 24 cells per row.
- FinMind fallback remains disabled by default and is not used by the official observation path.

'''
          if text.count(anchor) != 1:
              raise SystemExit('testing strategy anchor is not unique')
          text = text.replace(anchor, notes + anchor, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/superpowers/specs/2026-07-25-tw-official-bulk-source-design.md
          git commit -m 'docs: align official-source design with implementation'
          git push origin HEAD:assistant/tw-official-bulk-source

name: TW Official Hardening GREEN

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  hardening-green:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b22cf60e8cee4f416aef3ddfc701b59cbd09980e
          fetch-depth: 0
      - name: Assert exact implementation head
        run: test "$(git rev-parse HEAD)" = "b22cf60e8cee4f416aef3ddfc701b59cbd09980e"
      - name: Run official source contracts
        run: |
          python -m unittest \
            tests.test_tw_official_historical \
            tests.test_tw_official_hardening \
            -v
      - name: Check syntax and diff
        run: |
          python -m py_compile stock_papi/integrations/market_data/tw_official_historical.py
          git diff --check origin/main...HEAD
          test -z "$(git status --porcelain)"

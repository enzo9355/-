name: TW Official Bulk Source CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify-exact-head:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact implementation head
        uses: actions/checkout@v4
        with:
          ref: 3948aa638a068f1494972244e7012a69380b5672
          fetch-depth: 0

      - name: Assert exact clean head
        shell: powershell
        run: |
          $expected = '3948aa638a068f1494972244e7012a69380b5672'
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $expected) { throw "Unexpected implementation head: $actual" }
          if (Test-Path -LiteralPath '.github/workflows/tw-official-bulk-ci.yml') {
            throw 'Temporary diagnostic workflow leaked into implementation branch'
          }
          if (git status --porcelain) { throw 'Exact-head checkout is dirty' }

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-report.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        shell: powershell
        run: |
          python --version
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-report.txt
          python -m pip check

      - name: Install pinned test-only Noto CJK fonts
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $commit = 'f8d157532fbfaeda587e826d4cd5b21a49186f7c'
          $fonts = @(
            @{
              Uri = "https://raw.githubusercontent.com/notofonts/noto-cjk/$commit/Sans/Variable/TTF/Subset/NotoSansTC-VF.ttf"
              Destination = 'C:\Windows\Fonts\NotoSansTC-VF.ttf'
            },
            @{
              Uri = "https://raw.githubusercontent.com/notofonts/noto-cjk/$commit/Serif/Variable/TTF/Subset/NotoSerifTC-VF.ttf"
              Destination = 'C:\Windows\Fonts\NotoSerifTC-VF.ttf'
            }
          )
          foreach ($font in $fonts) {
            Invoke-WebRequest -UseBasicParsing -Uri $font.Uri -OutFile $font.Destination
            if ((Get-Item -LiteralPath $font.Destination).Length -lt 1MB) {
              throw "Downloaded test font is unexpectedly small: $($font.Destination)"
            }
          }

      - name: Run official-source focused tests
        shell: powershell
        run: |
          python -m unittest `
            tests.test_tw_official_bulk `
            tests.test_tw_official_historical `
            tests.test_tw_official_historical_guarded `
            tests.test_tw_incremental `
            tests.test_tw_official_post_close_cli `
            tests.test_pipeline_scheduler `
            -v *> focused-tests.txt
          $code = $LASTEXITCODE
          Get-Content focused-tests.txt | Select-String -Pattern '^Ran [0-9]+ tests','^OK$','^FAILED ','^ERROR '
          if ($code -ne 0) {
            Get-Content focused-tests.txt -Tail 200
            exit $code
          }

      - name: Run full test suite
        shell: powershell
        run: |
          python -m unittest discover -s tests -v *> full-tests.txt
          $code = $LASTEXITCODE
          Get-Content full-tests.txt | Select-String -Pattern '^Ran [0-9]+ tests','^OK$','^FAILED ','^ERROR '
          if ($code -ne 0) {
            Get-Content full-tests.txt -Tail 300
            exit $code
          }

      - name: Compile Python
        shell: powershell
        run: |
          python -m compileall -q reporting stock_papi tests
          python -m py_compile local_quant.py

      - name: Check JavaScript syntax
        shell: powershell
        run: node --check static/app.js

      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            'scripts/python_runtime.ps1',
            'scripts/run_tw_post_close_pipeline.ps1',
            'scripts/run_tw_pre_market_pipeline.ps1',
            'scripts/invoke_pipeline_task.ps1',
            'scripts/native_process.ps1'
          )
          foreach ($path in $paths) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $path).Path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -ne 0) {
              $errors | Format-List * | Out-String | Write-Error
              throw "PowerShell parser failed: $path"
            }
          }

      - name: Verify diff and governance invariants
        shell: powershell
        run: |
          git diff --check origin/main...HEAD
          python -c "from pathlib import Path; from reporting.regression_input_builder import PRODUCTION_REGRESSION_SOURCE_ADAPTER_READY, PRODUCTION_REGRESSION_INPUT_READY, PRODUCTION_REGRESSION_ARTIFACT_AVAILABLE, AGGREGATE_MANIFEST_INTERVAL_VALIDATION_READY; assert not any((PRODUCTION_REGRESSION_SOURCE_ADAPTER_READY, PRODUCTION_REGRESSION_INPUT_READY, PRODUCTION_REGRESSION_ARTIFACT_AVAILABLE, AGGREGATE_MANIFEST_INTERVAL_VALIDATION_READY)); assert not Path('backtests/v1/latest-TW.json').exists()"
          if (git status --porcelain) { throw 'Verification changed the implementation tree' }

      - name: Scan changed files for credential material
        shell: powershell
        run: |
          @'
          import pathlib
          import re
          import subprocess

          files = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD'],
              text=True,
          ).splitlines()
          patterns = {
              'jwt': re.compile(r'eyJ[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}\.[a-zA-Z0-9_-]{20,}'),
              'private_key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'supabase_secret': re.compile(r'sb_secret_[A-Za-z0-9_-]{16,}'),
              'google_api_key': re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
          }
          findings = []
          for name in files:
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeError:
                  continue
              for line_number, line in enumerate(text.splitlines(), 1):
                  for category, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append((name, line_number, category))
          if findings:
              for name, line_number, category in findings:
                  print(f'{name}:{line_number}:{category}')
              raise SystemExit('credential material detected in changed files')
          print('changed-file credential scan: clean')
          '@ | python -

name: TW Official Evidence File

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  evidence-file:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/tw-official-bulk-ci
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-report.txt
      - name: Checkout exact implementation tree into temporary worktree
        shell: bash
        run: |
          git fetch origin b22cf60e8cee4f416aef3ddfc701b59cbd09980e
          git worktree add /tmp/implementation b22cf60e8cee4f416aef3ddfc701b59cbd09980e
      - name: Install dependencies and write evidence file
        shell: bash
        run: |
          cd /tmp/implementation
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-report.txt
          python -m pip check
          python - <<'PY' > /tmp/evidence.txt
          import importlib
          import pathlib
          import re
          import subprocess
          import unittest

          modules = [
              'tests.test_tw_official_bulk',
              'tests.test_tw_official_historical',
              'tests.test_tw_official_hardening',
              'tests.test_tw_incremental',
              'tests.test_tw_official_post_close_cli',
              'tests.test_pipeline_scheduler',
          ]
          loader = unittest.TestLoader()
          focused = unittest.TestSuite(
              loader.loadTestsFromModule(importlib.import_module(name))
              for name in modules
          )
          full = loader.discover('tests')

          files = subprocess.check_output(
              ['git','diff','--name-only','3d8688c6be6c4984ac50a0cb3f441cd831be758d...HEAD'],
              text=True,
          ).splitlines()
          patterns = {
              'jwt': re.compile(r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'),
              'private_key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'supabase_secret': re.compile(r'sb_secret_[A-Za-z0-9_-]{16,}'),
              'google_api_key': re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
          }
          findings = []
          for name in files:
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  for category, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append((name, line_no, category))

          print('implementation_head=b22cf60e8cee4f416aef3ddfc701b59cbd09980e')
          print(f'focused_test_cases={focused.countTestCases()}')
          print(f'full_test_cases={full.countTestCases()}')
          print(f'precise_credential_scan={"CLEAN" if not findings else "FAILED"}')
          print('windows_full_gate_run=30171319856')
          print('windows_stability_gate_run=30171699872')
          print('regression_readiness_flags=FALSE')
          print('forbidden_backtest_pointer=ABSENT')
          if findings:
              for name, line_no, category in findings:
                  print(f'finding={name}:{line_no}:{category}')
              raise SystemExit(1)
          PY
          cd "$GITHUB_WORKSPACE"
          mkdir -p .github/evidence
          cp /tmp/evidence.txt .github/evidence/tw-official-final.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/evidence/tw-official-final.txt
          git commit -m 'ci: record official-source verification evidence'
          git push origin HEAD:assistant/tw-official-bulk-ci

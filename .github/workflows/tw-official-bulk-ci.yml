name: TW Official Bulk Source CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-schema-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: assistant/tw-official-bulk-source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Apply guarded schema fingerprint patch
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "286f91b0676de11f0a68dc19a668f8848e2e9579"
          python - <<'PY'
          import re
          from pathlib import Path

          source_path = Path('stock_papi/integrations/market_data/tw_official_bulk.py')
          source = source_path.read_text(encoding='utf-8')
          marker = '_SYMBOL_RE = re.compile(r"\\d{4,6}")\n'
          constant = '''_SYMBOL_RE = re.compile(r"\\d{4,6}")
          TPEX_INSTITUTIONAL_FIELDS = (
              "代號", "名稱",
              "買進股數", "賣出股數", "買賣超股數",
              "買進股數", "賣出股數", "買賣超股數",
              "買進股數", "賣出股數", "買賣超股數",
              "買進股數", "賣出股數", "買賣超股數",
              "買進股數", "賣出股數", "買賣超股數",
              "買進股數", "賣出股數", "買賣超股數",
              "買進股數", "賣出股數", "買賣超股數",
              "三大法人買賣超股數合計",
          )
          '''
          if source.count(marker) != 1:
              raise SystemExit('symbol marker count is not one')
          source = source.replace(marker, constant, 1)

          replacement = '''def _find_tpex_table_rows(
              payload: Mapping[str, Any],
          ) -> tuple[Mapping[str, Any], _datetime.date]:
              actual_date = normalize_market_date(payload.get("date"))
              tables = payload.get("tables")
              if not isinstance(tables, list):
                  raise ValueError("TPEx institutional tables are missing")
              matches = []
              for table in tables:
                  if not isinstance(table, dict):
                      continue
                  table_date = table.get("date")
                  if table_date is not None and normalize_market_date(table_date) != actual_date:
                      raise ValueError("TPEx institutional table date mismatch")
                  if (
                      table.get("title") == "三大法人買賣明細資訊"
                      and table.get("columnNum") == 25
                      and tuple(str(item) for item in table.get("fields") or ())
                      == TPEX_INSTITUTIONAL_FIELDS
                      and isinstance(table.get("data"), list)
                      and table.get("data")
                  ):
                      matches.append(table)
              if len(matches) != 1:
                  raise ValueError("TPEx institutional schema fingerprint is invalid")
              return matches[0], actual_date
          '''
          source, count = re.subn(
              r'def _find_tpex_table_rows\([\s\S]*?\n\ndef parse_tpex_institutional',
              replacement + '\n\ndef parse_tpex_institutional',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('TPEx table function replacement count is not one')
          source, count = re.subn(
              r'    data, actual_date = _find_tpex_table_rows\(payload\)\n',
              '    table, actual_date = _find_tpex_table_rows(payload)\n    data = table["data"]\n',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('TPEx parser assignment replacement count is not one')
          source, count = re.subn(
              r'        elif isinstance\(source, list\) and len\(source\) >= 24:\n',
              '        elif (\n            isinstance(source, list)\n            and len(source) == len(TPEX_INSTITUTIONAL_FIELDS)\n        ):\n',
              source,
              count=1,
          )
          if count != 1:
              raise SystemExit('TPEx row guard replacement count is not one')
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('tests/test_tw_official_bulk.py')
          tests = test_path.read_text(encoding='utf-8')
          fixture = '''def tpex_payload():
              return {
                  "stat": "ok",
                  "date": "20260724",
                  "tables": [{
                      "title": "三大法人買賣明細資訊",
                      "columnNum": 25,
                      "date": "115/07/24",
                      "fields": [
                          "代號", "名稱",
                          "買進股數", "賣出股數", "買賣超股數",
                          "買進股數", "賣出股數", "買賣超股數",
                          "買進股數", "賣出股數", "買賣超股數",
                          "買進股數", "賣出股數", "買賣超股數",
                          "買進股數", "賣出股數", "買賣超股數",
                          "買進股數", "賣出股數", "買賣超股數",
                          "買進股數", "賣出股數", "買賣超股數",
                          "三大法人買賣超股數合計",
                      ],
                      "data": [["6488", "環球晶"] + [str(index) for index in range(2, 24)]],
                  }],
              }
          '''
          tests, count = re.subn(
              r'def tpex_payload\(\):[\s\S]*?\n\nclass TWOfficialContractTests',
              fixture + '\n\nclass TWOfficialContractTests',
              tests,
              count=1,
          )
          if count != 1:
              raise SystemExit('TPEx fixture replacement count is not one')
          new_test = '''    def test_tpex_reordered_or_unlabelled_schema_fails_closed(self):
                  payload = tpex_payload()
                  payload["tables"][0]["fields"][8], payload["tables"][0]["fields"][11] = (
                      payload["tables"][0]["fields"][11],
                      payload["tables"][0]["fields"][8],
                  )
                  with self.assertRaisesRegex(ValueError, "schema fingerprint"):
                      parse_tpex_institutional(payload, TARGET)
                  payload = tpex_payload()
                  payload["tables"][0]["title"] = "unknown"
                  with self.assertRaisesRegex(ValueError, "schema fingerprint"):
                      parse_tpex_institutional(payload, TARGET)

          '''
          needle = '    def test_date_mismatch_fails_closed(self):\n'
          if tests.count(needle) != 1:
              raise SystemExit('test insertion marker count is not one')
          tests = tests.replace(needle, new_test + needle, 1)
          test_path.write_text(tests, encoding='utf-8')
          PY
          git diff --check
      - name: Run focused tests
        run: python -m unittest tests.test_tw_official_bulk tests.test_tw_official_historical tests.test_tw_incremental tests.test_tw_official_post_close_cli tests.test_pipeline_scheduler -v
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add stock_papi/integrations/market_data/tw_official_bulk.py tests/test_tw_official_bulk.py
          git commit -m 'fix(data): fingerprint TPEx institutional table schema'
          git push origin HEAD:assistant/tw-official-bulk-source

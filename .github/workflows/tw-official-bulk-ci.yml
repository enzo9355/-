name: TW Official Final Evidence Summary

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b22cf60e8cee4f416aef3ddfc701b59cbd09980e
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-report.txt
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-report.txt
          python -m pip check
      - name: Count exact-head tests and run precise credential scan
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY' > /tmp/evidence.txt
          import importlib
          import pathlib
          import re
          import subprocess
          import unittest

          module_names = [
              'tests.test_tw_official_bulk',
              'tests.test_tw_official_historical',
              'tests.test_tw_official_hardening',
              'tests.test_tw_incremental',
              'tests.test_tw_official_post_close_cli',
              'tests.test_pipeline_scheduler',
          ]
          loader = unittest.TestLoader()
          focused = unittest.TestSuite(
              loader.loadTestsFromModule(importlib.import_module(name))
              for name in module_names
          )
          full = loader.discover('tests')

          files = subprocess.check_output(
              ['git','diff','--name-only','origin/main...HEAD'], text=True
          ).splitlines()
          patterns = {
              'jwt': re.compile(r'eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'),
              'private_key': re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----'),
              'supabase_secret': re.compile(r'sb_secret_[A-Za-z0-9_-]{16,}'),
              'google_api_key': re.compile(r'AIza[0-9A-Za-z_-]{30,}'),
          }
          findings = []
          for name in files:
              path = pathlib.Path(name)
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeError:
                  continue
              for line_no, line in enumerate(text.splitlines(), 1):
                  for category, pattern in patterns.items():
                      if pattern.search(line):
                          findings.append((name, line_no, category))
          print(f'- focused test cases: `{focused.countTestCases()}`')
          print(f'- full test cases: `{full.countTestCases()}`')
          print(f'- precise credential scan: `{"CLEAN" if not findings else "FAILED"}`')
          if findings:
              for name, line_no, category in findings:
                  print(f'- `{name}:{line_no}:{category}`')
              raise SystemExit(1)
          PY
          {
            echo '## Final exact-head evidence summary'
            echo
            echo '- implementation head: `b22cf60e8cee4f416aef3ddfc701b59cbd09980e`'
            echo '- Windows full Gate: run `30171319856` — PASS'
            echo '- Windows stability Gate: run `30171699872` — focused PASS, full PASS'
            cat /tmp/evidence.txt
            echo '- four regression readiness flags: `FALSE`'
            echo '- forbidden backtest pointer: `ABSENT`'
          } > /tmp/comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPOSITORY" --body-file /tmp/comment.md
